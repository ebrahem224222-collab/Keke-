<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى نور عيني</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20 0%, #1a102f 50%, #2d1236 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating background hearts */
        .bg-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .bg-heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.15);
            font-size: 24px;
            animation: floatUp 8s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .container {
            width: 90%;
            max-width: 420px;
            z-index: 10;
            perspective: 1000px;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.05);
            transition: transform 0.6s ease, opacity 0.6s ease;
        }

        .icon-heart {
            font-size: 50px;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #ff4b72); }
            100% { transform: scale(1.18); filter: drop-shadow(0 0 20px #ff4b72); }
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        p.sub-title {
            font-size: 14px;
            color: #d1c4e9;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="password"]:focus {
            border-color: #ff4b72;
            box-shadow: 0 0 15px rgba(255, 75, 114, 0.4);
            background: rgba(0, 0, 0, 0.4);
        }

        button.btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ff4b72 0%, #ff2a55 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 75, 114, 0.4);
            transition: all 0.3s ease;
        }

        button.btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 75, 114, 0.6);
        }

        button.btn:active {
            transform: translateY(1px);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Message Screen */
        #message-screen {
            display: none;
            opacity: 0;
            transform: scale(0.9);
        }

        .message-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px 20px;
            margin: 20px 0;
            border: 1px dashed rgba(255, 182, 193, 0.4);
        }

        .main-message {
            font-size: 22px;
            font-weight: 900;
            line-height: 1.6;
            background: linear-gradient(135deg, #ffffff 0%, #ffb3c1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .sub-message {
            font-size: 15px;
            color: #e0e0e0;
            line-height: 1.6;
            margin-top: 15px;
        }

        .decor-hearts {
            font-size: 28px;
            margin-top: 15px;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <div class="bg-hearts" id="bgHearts"></div>

    <div class="container">
        <!-- Password Screen -->
        <div class="card" id="login-screen">
            <div class="icon-heart">🔒❤️</div>
            <h2>رسالة خاصة جداً</h2>
            <p class="sub-title">ادخل كلمة السر لرؤية المفاجأة</p>
            
            <div class="input-group">
                <input type="password" id="passInput" placeholder="ادخل كلمة السر هنا..." onkeypress="handleKeyPress(event)">
            </div>
            
            <button class="btn" onclick="checkPassword()">فتح الرسالة ✨</button>
            <div class="error-msg" id="errorMsg">كلمة السر غير صحيحة، حاول مرة ثانية! 💔</div>
        </div>

        <!-- Secret Message Screen -->
        <div class="card" id="message-screen">
            <div class="icon-heart">💖</div>
            <h2>إلى أغلى ما في حياتي</h2>
            
            <div class="message-box">
                <div class="main-message">
                    حقك عليّ يا نور عيني..<br>أنا مقدرش أستغني عنك ❤️
                </div>
                <div class="sub-message">
                    أنتِ كل حاجة حلوة في دنيتي، وأسف لو زعلتك في أي لحظة. وجودك في حياتي هو اللي بيحليها! ✨
                </div>
            </div>

            <div class="decor-hearts">💕 🌸 💖 🌸 💕</div>
        </div>
    </div>

    <script>
        // كلمة السر المعتمدة (يمكنك تغييرها هنا)
        const SECRET_PASS = "love";

        function checkPassword() {
            const input = document.getElementById("passInput").value.trim().toLowerCase();
            const errorMsg = document.getElementById("errorMsg");
            const loginScreen = document.getElementById("login-screen");
            const messageScreen = document.getElementById("message-screen");

            if (input === SECRET_PASS) {
                errorMsg.style.display = "none";
                
                // Fade out login screen
                loginScreen.style.opacity = "0";
                loginScreen.style.transform = "scale(0.8)";
                
                setTimeout(() => {
                    loginScreen.style.display = "none";
                    messageScreen.style.display = "block";
                    
                    // Trigger animation
                    setTimeout(() => {
                        messageScreen.style.opacity = "1";
                        messageScreen.style.transform = "scale(1)";
                    }, 50);
                }, 500);

            } else {
                errorMsg.style.display = "block";
                document.getElementById("passInput").value = "";
            }
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") {
                checkPassword();
            }
        }

        // Generate background floating hearts
        const bgContainer = document.getElementById("bgHearts");
        const heartIcons = ['❤️', '💖', '💕', '💗', '✨'];

        for (let i = 0; i < 25; i++) {
            const heart = document.createElement("div");
            heart.className = "bg-heart";
            heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 5 + 5) + "s";
            heart.style.animationDelay = (Math.random() * 5) + "s";
            heart.style.fontSize = (Math.random() * 15 + 15) + "px";
            bgContainer.appendChild(heart);
        }
    </script>
</body>
</html>
